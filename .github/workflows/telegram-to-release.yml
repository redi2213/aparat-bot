name: Telegram to GitHub Release

on:
  workflow_dispatch:
    inputs:
      telegram_url:
        description: "Telegram public message URL"
        required: true
        type: string

  repository_dispatch:
    types:
      - telegram_download

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:

      - name: Get Telegram URL
        id: get_data
        env:
          DISPATCH_URL: ${{ github.event.client_payload.telegram_url }}
          MANUAL_URL: ${{ inputs.telegram_url }}
        run: |
          if [ -n "$DISPATCH_URL" ]; then
            URL="$DISPATCH_URL"
          else
            URL="$MANUAL_URL"
          fi

          if [ -z "$URL" ]; then
            echo "Telegram URL is empty"
            exit 1
          fi

          echo "telegram_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram Started
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          TEXT=$(printf '%s\n\n%s' \
            '⏳ دانلود شروع شد...' \
            'فایل روی GitHub در حال دریافت است.')

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}"

      - name: Install tdl
        run: |
          VERSION="0.20.4"
          URL="https://github.com/iyear/tdl/releases/download/v${VERSION}/tdl_Linux_64bit.tar.gz"

          for i in 1 2 3 4 5; do
            echo "Attempt $i: downloading tdl $VERSION..."
            curl -fL --retry 3 --retry-delay 2 -o tdl.tar.gz "$URL"

            # Verify it's actually a gzip archive, not a truncated/partial file
            if gzip -t tdl.tar.gz 2>/dev/null; then
              echo "Download OK."
              break
            fi

            echo "Downloaded archive is corrupt/incomplete, retrying..."
            rm -f tdl.tar.gz
            sleep 3

            if [ "$i" -eq 5 ]; then
              echo "Failed to download a valid tdl archive after 5 attempts."
              exit 1
            fi
          done

          tar -xzf tdl.tar.gz tdl
          chmod +x tdl
          sudo mv tdl /usr/local/bin/tdl
          rm -f tdl.tar.gz

          tdl version

      - name: Restore Telegram session
        env:
          TDL_SESSION: ${{ secrets.TDL_SESSION }}
        run: |
          mkdir -p "$HOME/tdl-data"

          echo "$TDL_SESSION" | base64 -d \
            > "$HOME/telegram-session.tdl"

          tdl recover \
            -f "$HOME/telegram-session.tdl" \
            -n quickstart \
            --storage "type=bolt,path=$HOME/tdl-data"

          # Non-secret sanity check: confirm a namespace/session was actually
          # written to the bolt storage after recover (does not print any
          # secret values, only file existence/size).
          echo "Storage dir contents after recover:"
          ls -lh "$HOME/tdl-data" || true

      - name: Download Telegram file
        env:
          TELEGRAM_URL: ${{ steps.get_data.outputs.telegram_url }}
        run: |
          mkdir -p "$HOME/tg-download"
          cd "$HOME/tg-download"

          tdl dl \
            -n quickstart \
            --storage "type=bolt,path=$HOME/tdl-data" \
            -u "$TELEGRAM_URL"

      - name: Find downloaded file
        id: find_file
        run: |
          FILE=$(find "$HOME/tg-download/downloads" -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No downloaded file found."
            exit 1
          fi

          echo "FILE=$FILE" >> "$GITHUB_OUTPUT"
          echo "Downloaded: $FILE"

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.find_file.outputs.FILE }}
          TELEGRAM_URL: ${{ steps.get_data.outputs.telegram_url }}
        run: |
          TAG="tg-$(date +%Y%m%d-%H%M%S)"

          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Telegram Download $(date '+%Y-%m-%d %H:%M:%S')" \
            --notes "Downloaded from Telegram message: $TELEGRAM_URL"

          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          echo "Release created:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Get Direct Download URL
        id: direct_url
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.TAG }}
        run: |
          sleep 2

          DIRECT_URL=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[0].browser_download_url')

          if [ -z "$DIRECT_URL" ] || [ "$DIRECT_URL" = "null" ]; then
            echo "Could not get direct download URL"
            exit 1
          fi

          echo "DIRECT_URL=$DIRECT_URL" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Direct download URL:"
          echo "$DIRECT_URL"
          echo "=========================================="

      - name: Send Direct Download Link
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          DIRECT_URL: ${{ steps.direct_url.outputs.DIRECT_URL }}
        run: |
          TEXT=$(printf '%s\n\n%s\n%s' \
            '✅ دانلود با موفقیت انجام شد!' \
            '🔗 لینک مستقیم دانلود:' \
            "$DIRECT_URL")

          RESPONSE=$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Telegram notification sent successfully."
          else
            echo "Telegram notification failed."
            exit 1
          fi

      - name: Show Result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.release.outputs.TAG }}" \
            --repo "$GITHUB_REPOSITORY"

      - name: Notify Telegram Failed
        if: ${{ failure() && github.event_name == 'repository_dispatch' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          TEXT=$(printf '%s\n\n%s' \
            '❌ دانلود تلگرام ناموفق بود.' \
            'لاگ اجرای GitHub Actions را بررسی کنید.')

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
